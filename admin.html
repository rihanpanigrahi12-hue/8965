<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Webskill India House</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{max-width:1100px;margin:50px auto 80px}.admin-card{background:#0d2016;border:1px solid var(--line);padding:25px;border-radius:10px;margin-top:25px}.admin-form{max-width:420px}.admin-form label{display:block;margin:15px 0;font-size:12px}.admin-form input{width:100%;padding:13px;background:#09170f;border:1px solid #29402e;color:white;border-radius:5px;margin-top:7px}.admin-top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.admin-top h1{font-size:36px;margin:0}.admin-table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top;min-width:90px}th{color:var(--green)}td select{background:#09170f;color:white;border:1px solid #29402e;padding:7px;border-radius:4px}.admin-msg{font-size:12px;color:var(--green);margin-top:12px}.admin-msg.error{color:#ff9e8f}.order-detail{max-width:230px;white-space:pre-wrap;color:#aebdac}.hidden{display:none!important}@media(max-width:600px){.admin-wrap{margin:30px 16px}.admin-card{padding:17px}}
</style></head><body><header class="nav wrap"><a class="brand" href="/"><span class="brand-mark">W<span>⌂</span></span><span>webskill <b>india house</b></span></a><a href="/" class="text-link">← View website</a></header>
<main class="admin-wrap"><div class="eyebrow">PRIVATE DASHBOARD</div><div class="admin-top"><h1>Order enquiries</h1><button class="button button-outline hidden" id="logout">Log out ↗</button></div>
<section class="admin-card" id="loginCard"><h3>Admin login</h3><p style="color:var(--muted);font-size:12px">Sign in to view customer enquiries. Set your ADMIN_PASSWORD in the .env file first.</p><form class="admin-form" id="loginForm"><label>Admin password<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Sign in ↗</button><p class="admin-msg" id="loginMsg" role="status"></p></form></section>
<section class="admin-card hidden" id="ordersCard"><div class="admin-top"><div><h3>Recent enquiries</h3><p style="color:var(--muted);font-size:12px">Latest 500 orders, newest first.</p></div><button class="button button-outline" id="refresh">Refresh ↻</button></div><div id="ordersMsg" class="admin-msg" role="status"></div><div class="admin-table-wrap"><table><thead><tr><th>ID / Date</th><th>Customer</th><th>Business</th><th>Contact</th><th>Project</th><th>Budget</th><th>Details</th><th>Status</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></main>
<script>
const loginCard=document.getElementById('loginCard'),ordersCard=document.getElementById('ordersCard'),loginForm=document.getElementById('loginForm'),loginMsg=document.getElementById('loginMsg'),ordersMsg=document.getElementById('ordersMsg'),logout=document.getElementById('logout'),body=document.getElementById('ordersBody');
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function showDashboard(){loginCard.classList.add('hidden');ordersCard.classList.remove('hidden');logout.classList.remove('hidden');loadOrders()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadOrders(){ordersMsg.textContent='Loading…';try{const rows=await api('/api/admin/orders');body.innerHTML='';if(!rows.length){ordersMsg.textContent='No enquiries yet. New customer requests will appear here.';return}ordersMsg.textContent=`${rows.length} enquiry record(s).`;for(const o of rows){const tr=document.createElement('tr');tr.innerHTML=`<td>#${o.id}<br><small>${esc(o.created_at)} UTC</small></td><td>${esc(o.customer_name)}</td><td>${esc(o.business_name)}</td><td><a href="mailto:${encodeURIComponent(o.email)}">${esc(o.email)}</a><br>${esc(o.phone)}</td><td>${esc(o.service)}</td><td>${esc(o.budget)}</td><td><div class="order-detail">${esc(o.details)}</div></td><td><select aria-label="Order status" data-id="${o.id}">${['New','Contacted','In Progress','Completed','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td>`;body.appendChild(tr)}body.querySelectorAll('select').forEach(s=>s.addEventListener('change',async()=>{try{await api('/api/admin/orders/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({status:s.value})});ordersMsg.textContent='Order status updated.'}catch(e){ordersMsg.textContent=e.message;ordersMsg.className='admin-msg error'}}))}catch(e){if(e.message.toLowerCase().includes('log in')){loginCard.classList.remove('hidden');ordersCard.classList.add('hidden');logout.classList.add('hidden')}ordersMsg.textContent=e.message;ordersMsg.className='admin-msg error'}}
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='Signing in…';loginMsg.className='admin-msg';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:new FormData(loginForm).get('password')})});loginForm.reset();showDashboard()}catch(err){loginMsg.textContent=err.message;loginMsg.className='admin-msg error'}});
document.getElementById('refresh').addEventListener('click',loadOrders);
logout.addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{}loginCard.classList.remove('hidden');ordersCard.classList.add('hidden');logout.classList.add('hidden')});
</script></body></html>
